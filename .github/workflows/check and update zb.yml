name: Check and Update zb.txt
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Asia/Shanghai'
jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: check aowu jm
        run: |
          set -e
          curl -fsSL --connect-timeout 20 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"url":"http://118.89.172.248:8025/jar/zb.php"}' \
            "http://xn--nsr30b.cc/api/decode.php" -o /tmp/resp.json
          cat /tmp/resp.json

          # 校验返回是否ok
          if ! jq -e '.ok == true' /tmp/resp.json >/dev/null; then
            echo "❌ 解密接口返回失败，跳过更新"
            exit 0
          fi
          # 提取原始明文，存入原始临时文件
          jq -r '.data' /tmp/resp.json > /tmp/raw.txt
          if [ ! -s /tmp/raw.txt ]; then
            echo "❌ 解密后原始内容为空，跳过更新"
            exit 0
          fi

      - name: 临时文件内部去重筛选（区分大小写，仅整行完全相同删除）
        run: |
          awk '!seen[$0]++' /tmp/raw.txt > /tmp/deduped.txt
          BEFORE=$(wc -l < /tmp/raw.txt)
          AFTER=$(wc -l < /tmp/deduped.txt)
          echo "去重前 ${BEFORE} 行，去重后 ${AFTER} 行，移除重复 $((BEFORE - AFTER)) 行"

          if [ ! -s /tmp/deduped.txt ]; then
            echo "❌ 去重之后内容为空，跳过更新"
            exit 0
          fi

      - name: Diff对比精简文件与 zb.txt
        id: diff_step
        run: |
          mkdir -p ./config
          TARGET_FILE="./config/zb.txt"
          DEDUP_FILE="/tmp/deduped.txt"

          if [ -f "$TARGET_FILE" ]; then
            if diff -q "$DEDUP_FILE" "$TARGET_FILE"; then
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
              cp "$DEDUP_FILE" "$TARGET_FILE"
            fi
          else
            # 文件不存在，直接新建写入
            echo "changed=true" >> $GITHUB_OUTPUT
            cp "$DEDUP_FILE" "$TARGET_FILE"
          fi

      - name: Commit & Push
        if: steps.diff_step.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./config/zb.txt
          git commit -m "auto update zb.txt (aowu api decode + dedup)"
          git push
