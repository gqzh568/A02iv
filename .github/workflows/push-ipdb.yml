name: push qqwry.ipdb
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      TARGET_OWNER: gqzh568
      TARGET_REPO: itv
      TARGET_BRANCH: main
      FILE_PATH: utils/ip_checker/data/qqwry.ipdb
      SRC_URL: https://raw.githubusercontent.com/Guovin/iptv-api/refs/heads/master/utils/ip_checker/data/qqwry.ipdb
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_OWNER }}/${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 1

      - name: Download qqwry.ipdb
        run: |
          mkdir -p $(dirname ${{ env.FILE_PATH }})
          wget -O ${{ env.FILE_PATH }} ${{ env.SRC_URL }}

      - name: Git commit and push
        run: |
          git config --global user.name "IPDB Bot"
          git config --global user.email "bot@github@example.com"
          git add ${{ env.FILE_PATH }}
          git commit -m "auto update qqwry.ipdb" || echo "no changes to commit"
          git push
